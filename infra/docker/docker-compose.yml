services:
  mongodb:
    image: mongo:8.0
    container_name: laudo-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: laudo
    ports:
      - "27017:27017"
    volumes:
      - laudo-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:8.0
    container_name: laudo-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mongosh --host mongodb:27017 --eval
        'try { rs.status() } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) }'

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: laudo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/laudo?replicaSet=rs0
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      SEED_DEMO_INSTRUMENT: ${SEED_DEMO_INSTRUMENT:-true}
    volumes:
      - laudo-reports:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: laudo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  laudo-mongodb-data:
  laudo-reports:
