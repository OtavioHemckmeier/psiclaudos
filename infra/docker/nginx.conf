# Template processado pelo entrypoint da imagem nginx (envsubst) na inicialização.
# API_UPSTREAM: endereço interno da API (padrão http://api:3000, definido no Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass ${API_UPSTREAM}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html sempre revalidado: novas versões aparecem sem limpar cache.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por 1 ano.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
