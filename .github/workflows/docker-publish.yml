name: Docker Publish

# Publica as imagens da API e do web no GitHub Container Registry (GHCR).
# Disparo normal: `npm run release` cria e envia a tag vX.Y.Z.
# O deploy é feito manualmente no servidor (este workflow não implanta nada).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag extra da imagem (além de latest) para uma publicação manual
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      image_prefix: ${{ steps.resolve.outputs.image_prefix }}

    steps:
      - name: Resolve image tag and names
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ github.event.inputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE_TAG="${TAG_INPUT:-latest}"
          else
            IMAGE_TAG="$REF_NAME"
          fi
          # GHCR exige nomes em minúsculas: ghcr.io/<dono>/<repositorio>-<servico>
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "namespace=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$(basename "${REPOSITORY,,}")" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: resolve-tag

    env:
      IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
      IMAGE_BASE: ghcr.io/${{ needs.resolve-tag.outputs.namespace }}/${{ needs.resolve-tag.outputs.image_prefix }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            build_args: ''
          - service: web
            dockerfile: apps/web/Dockerfile
            # O web chama a API em /api; o nginx da imagem faz o proxy.
            build_args: |
              VITE_API_URL=/api

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          build-args: |
            ${{ matrix.build_args }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
          cache-to: type=inline

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "${IMAGE_BASE}-${{ matrix.service }}:${IMAGE_TAG}"
            echo "${IMAGE_BASE}-${{ matrix.service }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
