name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/api run db:generate
        env:
          DATABASE_URL: mongodb://localhost:27017/psiclaudos
      - run: npm run build
      - run: npm run test
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker/docker-compose.yml up --build -d
      - run: API_BASE=http://localhost:8080/api ./scripts/test-e2e.sh
      - if: always()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml logs --no-color
